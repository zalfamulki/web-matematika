# Varian tanpa build: konten di-serve dari clone repo di Server 1 (/opt/tugas6).
# Pakai file ini sebagai Compose path di Portainer jika build dari Git gagal.
services:
  web2:
    image: nginx:alpine
    container_name: web2
    ports:
      - "8082:80"
    volumes:
      - /opt/tugas6/web2/site:/usr/share/nginx/html:ro
    restart: unless-stopped
